<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockkiyajaye - Screenshot 5 (1080x1920)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0b0f19;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    .screenshot-container {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 60% 40%, #15803d 0%, #052e16 50%, #021a0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 100px 60px 0 60px;
    }

    .spotlight {
      position: absolute;
      top: -100px;
      right: 20%;
      width: 950px;
      height: 950px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.35) 0%, rgba(34, 197, 94, 0.1) 45%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    .flow-wave {
      position: absolute;
      top: 550px;
      right: -250px;
      width: 950px;
      height: 950px;
      border: 3px dashed rgba(74, 222, 128, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-section {
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 920px;
    }
    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(34, 197, 94, 0.15);
      border: 1.5px solid rgba(74, 222, 128, 0.4);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 50px;
      color: #4ade80;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 64px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .headline .highlight {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 50%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subline {
      font-size: 26px;
      color: #cbd5e1;
      font-weight: 500;
      line-height: 1.4;
    }

    .phone-mockup-wrapper {
      position: relative;
      z-index: 10;
      margin-top: 50px;
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 620px;
      height: 1250px;
      background: #0f172a;
      border: 12px solid #1e293b;
      border-bottom: 0px;
      border-radius: 54px 54px 0 0;
      box-shadow: 0 -20px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(34, 197, 94, 0.2);
      position: relative;
      overflow: hidden;
    }

    .notch {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      z-index: 30;
    }

    .screen-area {
      width: 100%;
      height: 100%;
      background: #090d16;
      padding-top: 60px;
      position: relative;
    }

    .screenshot-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      color: #94a3b8;
    }

    /* My Bookings UI Demo */
    .booking-card-demo {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .status-confirmed {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .replace-tag {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(250, 204, 21, 0.95);
      color: #0f172a;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="screenshot-container">
    <div class="spotlight"></div>
    <div class="grid-pattern"></div>
    <div class="flow-wave"></div>

    <div class="header-section">
      <div class="step-badge">05 / MATCH READY</div>
      <h1 class="headline">
        Manage Bookings & <span class="highlight">Get Playing</span>
      </h1>
      <p class="subline">
        Track upcoming games, invite squad teammates, and view match history seamlessly.
      </p>
    </div>

    <div class="phone-mockup-wrapper">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen-area">
          
          <div class="screenshot-placeholder">
            <div style="width:100%; color:#fff; font-weight:800; font-size:20px; margin-bottom:16px; text-align:left;">
              My Bookings
            </div>

            <div class="booking-card-demo">
              <span class="status-confirmed">✓ CONFIRMED</span>
              <div style="color:#fff; font-weight:800; font-size:18px;">Champions Turf Arena (7v7)</div>
              <div style="color:#94a3b8; font-size:14px; margin-top:4px;">📅 Sat, 03 Aug 2026 | 08:00 PM - 09:00 PM</div>
              <div style="margin-top:14px; display:flex; gap:10px;">
                <button style="flex:1; background:rgba(255,255,255,0.08); border:none; color:#fff; padding:10px; border-radius:10px; font-weight:700;">📍 Directions</button>
                <button style="flex:1; background:#22c55e; border:none; color:#fff; padding:10px; border-radius:10px; font-weight:700;">👥 Invite Squad</button>
              </div>
            </div>

            <div class="replace-tag">📷 INSERT ACTUAL APP SCREENSHOT HERE</div>
          </div>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
