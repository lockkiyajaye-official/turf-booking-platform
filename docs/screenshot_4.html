<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lockkiyajaye - Screenshot 4 (1080x1920)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0b0f19;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    .screenshot-container {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 40% 35%, #15803d 0%, #052e16 50%, #021a0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 100px 60px 0 60px;
    }

    .spotlight {
      position: absolute;
      top: -100px;
      left: 30%;
      width: 950px;
      height: 950px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.25) 0%, rgba(34, 197, 94, 0.1) 45%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    .flow-wave {
      position: absolute;
      top: 500px;
      left: -200px;
      width: 950px;
      height: 950px;
      border: 3px dashed rgba(250, 204, 21, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-section {
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 920px;
    }
    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(250, 204, 21, 0.15);
      border: 1.5px solid rgba(250, 204, 21, 0.4);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 50px;
      color: #facc15;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 64px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .headline .highlight {
      background: linear-gradient(135deg, #facc15 0%, #4ade80 50%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subline {
      font-size: 26px;
      color: #cbd5e1;
      font-weight: 500;
      line-height: 1.4;
    }

    .phone-mockup-wrapper {
      position: relative;
      z-index: 10;
      margin-top: 50px;
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 620px;
      height: 1250px;
      background: #0f172a;
      border: 12px solid #1e293b;
      border-bottom: 0px;
      border-radius: 54px 54px 0 0;
      box-shadow: 0 -20px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(250, 204, 21, 0.25);
      position: relative;
      overflow: hidden;
    }

    .notch {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      z-index: 30;
    }

    .screen-area {
      width: 100%;
      height: 100%;
      background: #090d16;
      padding-top: 60px;
      position: relative;
    }

    .screenshot-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      color: #94a3b8;
    }

    /* Checkout & Payment UI Demo */
    .checkout-card {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid rgba(250, 204, 21, 0.4);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .checkout-row {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
      font-size: 16px;
    }
    .lock-btn-demo {
      width: 100%;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #0f172a;
      font-weight: 900;
      font-size: 20px;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(250, 204, 21, 0.4);
    }

    .replace-tag {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(250, 204, 21, 0.95);
      color: #0f172a;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="screenshot-container">
    <div class="spotlight"></div>
    <div class="grid-pattern"></div>
    <div class="flow-wave"></div>

    <div class="header-section">
      <div class="step-badge">04 / INSTANT LOCK</div>
      <h1 class="headline">
        Lock Your Slot in <span class="highlight">1-Tap</span>
      </h1>
      <p class="subline">
        Fast, secure checkout with instant booking confirmation and zero hidden fees.
      </p>
    </div>

    <div class="phone-mockup-wrapper">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen-area">
          
          <div class="screenshot-placeholder">
            <div class="checkout-card">
              <div style="color:#fff; font-weight:800; font-size:20px;">Booking Summary</div>
              <div class="checkout-row"><span>Turf:</span><b style="color:#fff;">Champions Turf (7v7)</b></div>
              <div class="checkout-row"><span>Slot:</span><b style="color:#4ade80;">Sat, 03 Aug | 08:00 PM</b></div>
              <div class="checkout-row"><span>Duration:</span><b style="color:#fff;">1 Hour</b></div>
              <div style="border-top:1px dashed rgba(255,255,255,0.15); padding-top:12px;" class="checkout-row">
                <span style="font-size:18px; font-weight:700; color:#fff;">Total Payable:</span>
                <b style="font-size:22px; color:#facc15;">₹1,400</b>
              </div>
            </div>

            <div class="lock-btn-demo">🔒 LOCK SLOT NOW</div>

            <div class="replace-tag">📷 INSERT ACTUAL APP SCREENSHOT HERE</div>
          </div>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
