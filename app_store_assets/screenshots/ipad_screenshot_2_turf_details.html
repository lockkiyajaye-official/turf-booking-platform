<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store iPad Screenshot 2 - Turf Details</title>
  <link rel="stylesheet" href="ipad_screenshot_template.css">
</head>
<body>

  <!-- App Store Canvas: 2048 x 2732 px -->
  <div class="appstore-canvas" id="canvas-ipad-screenshot-2">
    <div class="ambient-glow-top green"></div>
    <div class="ambient-glow-bottom pink"></div>
    <div class="pitch-lines"></div>

    <!-- Header Section -->
    <div class="header-container">
      <div class="badge-tag green">🏟️ Turf Specs & Real-Time Slots</div>
      <h1 class="headline">EXPLORE TURF SPECS & <span class="highlight-green">LIVE SLOTS</span></h1>
      <p class="subheadline">High-quality pitches, verified amenities, player count selector & real-time slot booking.</p>
    </div>

    <!-- iPad Pro Mockup -->
    <div class="ipad-frame green-glow">
      <div class="ipad-camera"></div>
      <div class="screen-container">
        <img class="ipad-screenshot-img" src="ipad-screenshots/img-2.png" alt="Turf Details iPad">
      </div>
    </div>
  </div>

</body>
</html>
