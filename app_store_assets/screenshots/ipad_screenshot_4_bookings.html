<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store iPad Screenshot 4 - My Bookings</title>
  <link rel="stylesheet" href="ipad_screenshot_template.css">
</head>
<body>

  <!-- App Store Canvas: 2048 x 2732 px -->
  <div class="appstore-canvas" id="canvas-ipad-screenshot-4">
    <div class="ambient-glow-top green"></div>
    <div class="ambient-glow-bottom pink"></div>
    <div class="pitch-lines"></div>

    <!-- Header Section -->
    <div class="header-container">
      <div class="badge-tag green">🎟️ Match Management</div>
      <h1 class="headline">TRACK & MANAGE <span class="highlight-green">YOUR BOOKINGS</span></h1>
      <p class="subheadline">View active match schedules, past game records, and instant confirmation passes.</p>
    </div>

    <!-- iPad Pro Mockup -->
    <div class="ipad-frame green-glow">
      <div class="ipad-camera"></div>
      <div class="screen-container">
        <img class="ipad-screenshot-img" src="ipad-screenshots/img-4.png" alt="My Bookings iPad">
      </div>
    </div>
  </div>

</body>
</html>
