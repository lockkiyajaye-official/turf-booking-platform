<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store iPad Screenshot 5 - Player Profile</title>
  <link rel="stylesheet" href="ipad_screenshot_template.css">
</head>
<body>

  <!-- App Store Canvas: 2048 x 2732 px -->
  <div class="appstore-canvas" id="canvas-ipad-screenshot-5">
    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom cyan"></div>
    <div class="pitch-lines"></div>

    <!-- Header Section -->
    <div class="header-container">
      <div class="badge-tag pink">👤 Player Profile</div>
      <h1 class="headline">CUSTOMIZE YOUR <span class="highlight-pink">PLAYER PROFILE</span></h1>
      <p class="subheadline">Manage personal details, notification preferences, cancellation policies & quick help support.</p>
    </div>

    <!-- iPad Pro Mockup -->
    <div class="ipad-frame">
      <div class="ipad-camera"></div>
      <div class="screen-container">
        <img class="ipad-screenshot-img" src="ipad-screenshots/img-5.png" alt="Player Profile iPad">
      </div>
    </div>
  </div>

</body>
</html>
