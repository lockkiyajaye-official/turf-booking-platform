<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store iPad Screenshot 3 - Search & Explore</title>
  <link rel="stylesheet" href="ipad_screenshot_template.css">
</head>
<body>

  <!-- App Store Canvas: 2048 x 2732 px -->
  <div class="appstore-canvas" id="canvas-ipad-screenshot-3">
    <div class="ambient-glow-top cyan"></div>
    <div class="ambient-glow-bottom green"></div>
    <div class="pitch-lines"></div>

    <!-- Header Section -->
    <div class="header-container">
      <div class="badge-tag cyan">🔍 Explore & Discover</div>
      <h1 class="headline">SEARCH & EXPLORE <span class="highlight-cyan">POPULAR ARENAS</span></h1>
      <p class="subheadline">Search venues by location or sport, browse popular sports turfs, and discover nearby zones.</p>
    </div>

    <!-- iPad Pro Mockup -->
    <div class="ipad-frame cyan-glow">
      <div class="ipad-camera"></div>
      <div class="screen-container">
        <img class="ipad-screenshot-img" src="ipad-screenshots/img-3.png" alt="Search and Explore iPad">
      </div>
    </div>
  </div>

</body>
</html>
