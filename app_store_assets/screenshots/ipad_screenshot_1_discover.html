<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store iPad Screenshot 1 - Discover Turfs</title>
  <link rel="stylesheet" href="ipad_screenshot_template.css">
</head>
<body>

  <!-- App Store Canvas: 2048 x 2732 px -->
  <div class="appstore-canvas" id="canvas-ipad-screenshot-1">
    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom"></div>
    <div class="pitch-lines"></div>

    <!-- Header Section -->
    <div class="header-container">
      <div class="badge-tag pink">⚡ Instant Turf Booking</div>
      <h1 class="headline">FIND & BOOK <span class="highlight-pink">PREMIUM TURFS</span></h1>
      <p class="subheadline">Discover top-rated football, cricket & basketball venues near you with live availability.</p>
    </div>

    <!-- iPad Pro Mockup -->
    <div class="ipad-frame">
      <div class="ipad-camera"></div>
      <div class="screen-container">
        <img class="ipad-screenshot-img" src="ipad-screenshots/img-1.png" alt="Discover Turfs iPad">
      </div>
    </div>
  </div>

</body>
</html>
